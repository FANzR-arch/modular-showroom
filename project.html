<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project | Solenne</title>
<meta name="description" content="A Solenne project: the brief, the scent approach, photos and the candles and diffusers used.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111214'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23dfe4e8' font-family='Arial' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script defer src="assets/config.js"></script>
<script defer src="assets/projects.js"></script>
<script defer src="assets/site.js"></script>
<style>
.pd-top { display: grid; grid-template-columns: 1.25fr 1fr; gap: clamp(28px, 4vw, 70px); padding-top: calc(var(--hdr) + 40px); align-items: start; }
.pd-media { display: grid; gap: 12px; }
.pd-cover { aspect-ratio: 4 / 3; cursor: zoom-in; }
.pd-info { position: sticky; top: calc(var(--hdr) + 32px); display: grid; gap: 22px; }
.pd-info .code { font-size: 13px; color: var(--ink3); letter-spacing: .04em; }
.pd-info .tag { font: 400 19px/1.4 var(--fd); color: var(--ink2); letter-spacing: -.01em; }
.facts { margin: 0; border-top: 1px solid var(--ink); display: grid; grid-template-columns: 1fr 1fr; }
.facts div { padding: 13px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 74px 1fr; gap: 10px; font-size: 14px; }
.facts .wide { grid-column: 1 / -1; }
.facts dt { color: var(--ink3); font-size: 12.5px; padding-top: 1px; }
.facts dd { margin: 0; }
.price { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--ink); }
.price span { font-size: 13px; color: var(--ink2); }
.price b { font: 500 22px var(--fd); letter-spacing: -.02em; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }
.pd-sec { padding-top: clamp(64px, 8vw, 120px); }
.sec-t { font: 500 15px var(--f); letter-spacing: 0; margin-bottom: 16px; }
.pd-grid { display: grid; gap: 12px; }
.pd-grid.n1 { grid-template-columns: 1fr; } .pd-grid.n1 .media { aspect-ratio: 21 / 9; }
.pd-grid.n2 { grid-template-columns: 1fr 1fr; } .pd-grid.n2 .media { aspect-ratio: 4 / 3.2; }
.pd-grid.n3, .pd-grid.n4 { grid-template-columns: 1fr 1fr; } .pd-grid.n3 .media, .pd-grid.n4 .media { aspect-ratio: 1; }
.pd-grid .media { cursor: zoom-in; }
.pd-grid img { transition: transform 1.1s var(--ease); }
.pd-grid .media:hover img { transform: scale(1.04); }
.pd-fx-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
.pd-fx { border-top: 1px solid var(--ink); }
.fx { display: grid; grid-template-columns: 160px 1fr; gap: clamp(16px, 3vw, 44px); align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
.fx code { font: 500 12.5px var(--f); color: var(--ink3); letter-spacing: .03em; }
.fx h3 { font-size: 20px; letter-spacing: -.02em; margin: 6px 0 4px; }
.fx p { font-size: 14px; color: var(--ink2); }
.fx-p { display: grid; gap: 10px; justify-items: end; font-size: 14px; }
.fx-p .btn { height: 38px; font-size: 13px; padding: 0 16px; }
.pd-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; padding-top: clamp(70px, 9vw, 130px); padding-bottom: clamp(70px, 9vw, 130px); }
.pd-nav a { display: grid; gap: 6px; }
.pd-nav span { font-size: 13px; color: var(--ink2); }
.pd-nav b { font: 500 clamp(18px, 2vw, 26px)/1.15 var(--fd); letter-spacing: -.02em; }
.pd-nav .all { border: 1px solid var(--line); border-radius: 999px; padding: 10px 20px; font-size: 14px; transition: all .3s; }
.pd-nav .all:hover { background: var(--ink); color: var(--bg); }
@media (max-width: 900px) {
  .pd-top { grid-template-columns: 1fr; }
  .pd-info { position: static; }
  .fx { grid-template-columns: 96px 1fr; }
  .pd-nav { grid-template-columns: 1fr 1fr; } .pd-nav .all { display: none; }
}
@media (max-width: 560px) { .facts { grid-template-columns: 1fr; } .pd-grid.n2, .pd-grid.n3, .pd-grid.n4 { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page="projects">
<main id="pdetail"></main>
</body>
</html>
